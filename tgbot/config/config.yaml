app:
  name: Devoicer
  version: 1.0.0

telegram:
  token: "TELEGRAM_APITOKEN"
  baseUrl: "https://api.telegram.org"
  webhookUrl: "https://test.com/webhook"
  timeout: 60

database:
  host: "DB_HOST"
  port: 5432
  user: "DB_USER"
  password: "DB_PASSWORD"
  name: "tg-devoicer-db"
  maxConnections: 10

speechKit:
  url: "https://stt.api.cloud.yandex.net/speech/v1/stt:recognize"
  token: "IAM_TOKEN"
  timeout: 10

#notifications:
#  enabled: true
#  interval: 60
#  retry_attempts: 3

logging:
  level: "info"
  file: "logs/app.log"
